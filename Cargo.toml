[package]
name = "aion2dps"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Passive AION 2 damage meter. Listens to your own game traffic and never reads process memory."
publish = false

# The desktop app lives in `src-tauri/` as its own crate, so this engine and its
# tests build without any Tauri dependency.

[dependencies]
axum = "0.7"
etherparse = "0.19"
lz4_flex = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
