<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aion2dps overlay</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/overlay.css">
<link rel="stylesheet" href="css/notify.css">
</head>
<body>
<div class="card" id="card">
  <div class="content">
    <div class="hit-top" id="hit-top">
      <header class="head">
        <span class="drag-grip app-only" id="drag-grip" title="Drag to move" aria-hidden="true"><i></i><i></i></span>
        <span class="dot" id="dot"></span>
        <span class="target" id="target">Waiting for combat</span>
        <span class="tags" id="tags">
          <span class="target-badge" id="target-badge" hidden></span>
          <span class="target-badge defeated" id="target-defeated" hidden>Defeated</span>
          <button type="button" class="lock-chip" id="lock-chip" hidden></button>
        </span>
        <span class="seg" id="view" role="group" aria-label="Show">
          <button type="button" data-view="damage" class="on" title="Damage"><span class="seg-full">Dmg</span><span class="seg-short" aria-hidden="true">D</span></button>
          <button type="button" data-view="heal" class="heal" title="Healing"><span class="seg-full">Heal</span><span class="seg-short" aria-hidden="true">H</span></button>
        </span>
        <span class="timer" id="timer">00:00</span>
        <button class="tool save app-only" id="save-session" type="button" title="Save session" disabled>
          <svg class="idle" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7M4.8 6.6 8 9.8l3.2-3.2M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="done" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8.4 6.4 11.6 12.8 4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool update app-only" id="update-chip" type="button" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7.5M4.8 7 8 10.2 11.2 7M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool app-only" id="open-meter" type="button" title="Open the detailed meter">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2h5v5M14 2 8 8M12 9.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool reset" id="reset" type="button" title="Reset fight">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.4 8a5.4 5.4 0 1 1-1.6-3.8M13.4 2.6v2.8h-2.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool app-only" id="close" type="button" title="Close the overlay">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </header>
    </div>
    <div class="banner" id="banner" hidden>Fight ended &#183; resets in <span id="banner-secs">30</span>s</div>
    <section class="summary">
      <span class="label" id="total-label">Group total damage</span>
      <span class="value" id="total">0</span>
      <span class="sep" aria-hidden="true">&#183;</span>
      <span class="label" id="dps-label">Group DPS</span>
      <span class="value" id="dps">0/s</span>
    </section>
    <div class="rows empty" id="rows">Waiting for combat</div>
    <div class="debug-note" id="debug-note" hidden></div>
    <div class="status" id="foot-note">Idle reset in 30s</div>
  </div>
  <aside class="cube-alert" id="cube-alert" role="status" aria-live="polite" hidden>
    <svg class="cube-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 29 9.5v13L16 30 3 22.5v-13ZM3 9.5 16 17l13-7.5M16 17v13M9.5 5.8l13 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <div class="cube-copy"><strong class="cube-title" data-cube-title>Hidden Cube nearby</strong><span class="cube-subline" data-cube-subline></span></div>
    <button class="cube-close" type="button" aria-label="Dismiss hidden cube alert" title="Dismiss hidden cube alert">&#215;</button>
  </aside>
  <div class="rz n app-only" data-dir="North"></div>
  <div class="rz s app-only" data-dir="South"></div>
  <div class="rz e app-only" data-dir="East"></div>
  <div class="rz w app-only" data-dir="West"></div>
  <div class="rz ne app-only" data-dir="NorthEast"></div>
  <div class="rz nw app-only" data-dir="NorthWest"></div>
  <div class="rz se app-only" data-dir="SouthEast"></div>
  <div class="rz sw app-only" data-dir="SouthWest"></div>
</div>
<script src="js/format.js"></script>
<script src="js/player-colors.js"></script>
<script src="js/bridge.js"></script>
<script src="js/naming.js"></script>
<script src="js/boss-lock.js"></script>
<script src="js/session-save.js"></script>
<script src="js/alerts-schedule.js"></script>
<script src="js/toast-queue.js"></script>
<script src="js/toast-style.js"></script>
<script src="js/notify.js"></script>
<script src="js/heal-share.js"></script>
<script src="js/npcap-help.js"></script>
<script src="js/cube-alert.js"></script>
<script src="js/updates.js"></script>
<script src="js/overlay.js"></script>
</body>
</html>
