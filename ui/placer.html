<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aion2dps - place pop-up</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/notify.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: rgba(5, 7, 10, 0.45); font-family: var(--font); color: var(--text); user-select: none; }
  .pl-hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 16px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--panel); color: var(--muted); font-size: 13px; pointer-events: none; text-align: center; }
  .pl-hint b { color: var(--text); }
  .pl-guide { position: fixed; background: rgba(91, 157, 255, 0.35); pointer-events: none; }
  .pl-guide.v { top: 0; bottom: 0; width: 1px; left: 50%; }
  .pl-guide.h { left: 0; right: 0; height: 1px; top: 50%; }
  .pl-box { position: fixed; display: flex; align-items: center; box-sizing: border-box; outline: 2px dashed var(--accent); outline-offset: 3px; border-radius: var(--r-md); cursor: grab; touch-action: none; }
  .pl-box.dragging { cursor: grabbing; }
  .pl-box .notify-host { pointer-events: none; }
  .pl-box .toast { pointer-events: none; }
  .pl-cube { width: 100%; height: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 18px; border: 1px solid #22d3ee; border-radius: 12px; background: #101d25; color: #22d3ee; font-size: 22px; font-weight: 700; }
  .pl-where { position: absolute; left: 0; top: calc(100% + 8px); padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #0b0d10; font-size: 11px; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
<div class="pl-guide v"></div><div class="pl-guide h"></div>
<div class="pl-hint" id="pl-hint">Drag the pop-up where you want it. <b>Drop</b> to save &middot; <b>Esc</b> cancels.</div>
<div class="pl-box" id="pl-box"><span class="pl-where" id="pl-where"></span></div>
<script src="js/format.js"></script>
<script src="js/bridge.js"></script>
<script src="js/alerts-schedule.js"></script>
<script src="js/toast-queue.js"></script>
<script src="js/toast-style.js"></script>
<script src="js/notify.js"></script>
<script src="js/placer.js"></script>
</body>
</html>
