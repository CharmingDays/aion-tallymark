[package]
name = "aion2dps-app"
version = "0.3.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Desktop shell for the aion2dps passive damage meter: overlay and detailed meter windows."
publish = false
default-run = "aion2dps"

# Its own workspace, so the engine at the repository root keeps building and
# testing offline without any Tauri crate.
[workspace]

[[bin]]
name = "aion2dps"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aion2dps = { path = ".." }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
